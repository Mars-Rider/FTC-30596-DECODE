<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LED Strip Dashboard</title>

    <style>
        body {
            background: #0b0f14;
            font-family: Inter, Arial, sans-serif;
            color: #e6e6e6;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
        }

        .card {
            background: #121822;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #1f2937;
        }

        .card.disconnected {
            opacity: 0.35;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badges {
            display: flex;
            gap: 6px;
        }

        .badge {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 999px;
            background: #1f2937;
            border: 1px solid #374151;
        }

        .strip {
            height: 16px;
            border-radius: 8px;
            background: #111;
            overflow: hidden;
            position: relative;
        }

        .strip::after {
            content: "";
            position: absolute;
            inset: 0;
        }
    </style>
</head>

<body>

    <h1>LED Strip Status</h1>
    <div class="grid" id="grid"></div>

    <script>
        const STRIP_COUNT = 5;
        const LED_COUNT = 60;

        // ---------- PATTERNS ----------
        const PATTERN = {
            SOLID: 0,
            BREATHE: 1,
            SCANNER: 2,
            PINGPONG: 3,
            HEARTBEAT: 4,
            RADAR: 5
        };

        // ---------- STRIP STATE ----------
        const strips = new Array(STRIP_COUNT).fill(null).map(() => ({
            pattern: PATTERN.SOLID,
            r: 0, g: 0, b: 0,
            speed: 128,
            period: 1000,
            trail: 64,
            pos: 0,
            dir: 1,
            buffer: Array.from({ length: LED_COUNT }, () => ({ r: 0, g: 0, b: 0 }))
        }));

        // ---------- TIME ----------
        const startMillis = performance.now();
        const espMillis = () => performance.now() - startMillis;

        // ---------- FASTLED ----------
        function fadeToBlackBy(rgb, fadeBy) {
            const scale = 255 - fadeBy;
            return {
                r: (rgb.r * scale) >> 8,
                g: (rgb.g * scale) >> 8,
                b: (rgb.b * scale) >> 8
            };
        }

        // ---------- PACKET DECODER (WebSocket calls this) ----------
        function decodePacket(bytes) {
            const i = bytes[0];
            if (i >= STRIP_COUNT) return;

            const s = strips[i];
            s.pattern = bytes[1];
            s.r = bytes[2];
            s.g = bytes[3];
            s.b = bytes[4];
            s.speed = bytes[5];
            s.period = bytes[6] * 10 + 100;
            s.trail = bytes[7];
            s.dir = bytes[8] || 1; // New: direction (1=right, -1=left)
        }

        // ---------- LED ENGINE ----------
        function renderStrip(s, dt) {
            // Fade all LEDs (trail)
            s.buffer = s.buffer.map(px => fadeToBlackBy(px, s.trail));

            const head = { r: s.r, g: s.g, b: s.b };

            const step = (s.speed / 255) * dt * 0.05;

            if (s.pattern === PATTERN.SCANNER || s.pattern === PATTERN.PINGPONG) {
                s.pos += step * s.dir;

                if (s.pattern === PATTERN.PINGPONG) {
                    if (s.pos >= LED_COUNT - 1) s.dir = -1;
                    if (s.pos <= 0) s.dir = 1;
                } else {
                    // SCANNER wraps around edges
                    if (s.pos >= LED_COUNT) s.pos = 0;
                    if (s.pos < 0) s.pos = LED_COUNT - 1;
                }

                const idx = Math.round(s.pos);
                s.buffer[idx] = { ...head };
            }

            if (s.pattern === PATTERN.RADAR) {
                s.pos = (s.pos + step) % LED_COUNT;
                s.buffer[Math.round(s.pos)] = { ...head };
            }

            if (s.pattern === PATTERN.BREATHE) {
                const b = (Math.sin(espMillis() / s.period * Math.PI * 2) + 1) / 2;
                s.buffer = s.buffer.map(() => ({
                    r: Math.round(s.r * b),
                    g: Math.round(s.g * b),
                    b: Math.round(s.b * b)
                }));
            }

            if (s.pattern === PATTERN.HEARTBEAT) {
                const beat = Math.sin(espMillis() / s.period * Math.PI * 2);
                if (beat > 0.9) s.buffer = s.buffer.map(() => ({ ...head }));
            }

            if (s.pattern === PATTERN.SOLID) {
                s.buffer = s.buffer.map(() => ({ ...head }));
            }
        }

        // ---------- UI ----------
        function bufferToGradient(buf) {
            const stops = [];
            for (let i = 0; i < buf.length; i += Math.floor(buf.length / 10)) {
                const c = buf[i];
                stops.push(`rgb(${c.r | 0},${c.g | 0},${c.b | 0}) ${i / buf.length * 100}%`);
            }
            return `linear-gradient(90deg, ${stops.join(",")})`;
        }

        // ---------- BUILD CARDS ----------
        function render() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";

            for (let i = 0; i < STRIP_COUNT; i++) {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                <div class="header">
                    <strong>Strip ${i + 1}</strong>
                    <div class="badges">
                        <span class="badge">ACTIVE</span>
                    </div>
                </div>
                <div class="strip"></div>
            `;

                grid.appendChild(card);
            }
        }

        // ---------- ANIMATION ----------
        function animate() {
            document.querySelectorAll(".card").forEach((card, i) => {
                const stripEl = card.querySelector(".strip");
                const s = strips[i];

                renderStrip(s, 16);
                stripEl.style.background = bufferToGradient(s.buffer);
            });

            requestAnimationFrame(animate);
        }

        render();
        animate();

        /* ---------- TEST DATA ---------- */
        setInterval(() => {
            decodePacket(new Uint8Array([0, PATTERN.SCANNER, 255, 0, 0, 180, 100, 40, 1]));
            decodePacket(new Uint8Array([1, PATTERN.RADAR, 0, 255, 0, 160, 80, 50, 1]));
            decodePacket(new Uint8Array([2, PATTERN.BREATHE, 0, 0, 255, 0, 120, 0, 1]));
        }, 1000);
    </script>
</body>

</html>
